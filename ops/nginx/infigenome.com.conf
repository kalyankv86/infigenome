# /etc/nginx/sites-available/infigenome.com
# ln -s /etc/nginx/sites-available/infigenome.com /etc/nginx/sites-enabled/
#
# Certbot (--nginx) will add the :443 server block and the redirect below.

server {
    listen 80;
    listen [::]:80;
    server_name infigenome.com www.infigenome.com;

    # Let certbot answer the ACME challenge, proxy everything else.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # API — Fastify on :4000, mounted under /api and /health
    location ~ ^/(api|health) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 2m;
}
